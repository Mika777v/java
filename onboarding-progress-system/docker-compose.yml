services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}
      POSTGRES_DB: onboarding_db
    ports:
      # Only from this machine (localhost), not from the network.
      # The Codespaces setup (docker-compose.codespaces.yml) also connects through localhost.
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d onboarding_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/onboarding_db
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is not set}
      SPRING_JPA_HIBERNATE_DDL_AUTO: none
      # First administrator (created on startup if none exists)
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-admin@example.com}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?APP_ADMIN_PASSWORD is not set}
      # true: set the password of APP_ADMIN_EMAIL back to APP_ADMIN_PASSWORD on start (remove after use)
      APP_ADMIN_PASSWORD_RESET: ${APP_ADMIN_PASSWORD_RESET:-false}
      # How new employees log in: "link" (personal link, default) or "password"
      APP_MEMBER_LOGIN: ${APP_MEMBER_LOGIN:-link}
      # Address shown in personal links (empty: the address the browser used)
      APP_BASE_URL: ${APP_BASE_URL:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
