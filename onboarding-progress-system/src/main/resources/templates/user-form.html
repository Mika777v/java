<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${userId == null} ? 'ユーザー登録' : 'ユーザー編集'">ユーザー登録</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav('users')}"></nav>

<h1 th:text="${userId == null} ? 'ユーザー登録' : 'ユーザー編集'">ユーザー登録</h1>

<form th:action="${userId == null} ? @{/users} : @{/users/{id}(id=${userId})}"
      th:object="${userForm}" method="post">

    <div class="form-row">
        <label for="name">氏名 <span class="required">*</span></label>
        <input type="text" id="name" th:field="*{name}" maxlength="100">
        <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">氏名を入力してください</div>
    </div>

    <div class="form-row">
        <label for="email">メールアドレス <span class="required">*</span></label>
        <input type="text" id="email" th:field="*{email}" maxlength="255" placeholder="taro@example.com">
        <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">メールアドレスを入力してください</div>
    </div>

    <div class="form-row">
        <label for="department">部署</label>
        <input type="text" id="department" th:field="*{department}" maxlength="100">
        <div class="error" th:if="${#fields.hasErrors('department')}" th:errors="*{department}">部署は100文字以内で入力してください</div>
    </div>

    <div class="form-row">
        <label for="role">役割 <span class="required">*</span></label>
        <select id="role" th:field="*{role}">
            <option th:each="r : ${roles}" th:value="${r}" th:text="${r.label}">新入社員</option>
        </select>
        <div class="error" th:if="${#fields.hasErrors('role')}" th:errors="*{role}">役割を選択してください</div>
    </div>

    <div class="form-row">
        <label for="password" th:text="${userId == null} ? '初期パスワード' : '新しいパスワード'">初期パスワード</label>
        <input type="password" id="password" th:field="*{password}" autocomplete="new-password" maxlength="72">
        <div class="muted small" th:if="${userId == null}">
            8文字以上。空欄のままにすると、このユーザーはログインできません(あとから設定できます)。
        </div>
        <div class="muted small" th:if="${userId != null}"
             th:text="${loginEnabled} ? '変更する場合だけ入力してください(8文字以上)。空欄なら今のパスワードのままです。'
                                      : 'まだパスワードがありません。設定するとログインできるようになります(8文字以上)。'">
            変更する場合だけ入力してください。
        </div>
        <div class="muted small" th:if="${@loginSettings.linkMode}">
            新入社員はパスワードではなく、ユーザー詳細画面で発行する専用URLでログインします。パスワードが必要なのは管理者だけです。
        </div>
        <div class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">パスワードは8文字以上で入力してください</div>
    </div>

    <div class="form-row">
        <label for="joinedOn">入社日</label>
        <input type="date" id="joinedOn" th:field="*{joinedOn}">
        <div class="error" th:if="${#fields.hasErrors('joinedOn')}">日付の形式が正しくありません</div>
    </div>

    <button type="submit" class="button" th:text="${userId == null} ? '登録する' : '更新する'">登録する</button>
    <a class="button button-secondary"
       th:href="${userId == null} ? @{/users} : @{/users/{id}(id=${userId})}">戻る</a>
</form>
</body>
</html>
