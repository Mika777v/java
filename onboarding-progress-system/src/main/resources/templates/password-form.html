<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>パスワード変更</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav('password')}"></nav>

<h1>パスワード変更</h1>

<form th:action="@{/me/password}" th:object="${passwordForm}" method="post">

    <div class="form-row">
        <label for="currentPassword">現在のパスワード <span class="required">*</span></label>
        <input type="password" id="currentPassword" th:field="*{currentPassword}"
               autocomplete="current-password" maxlength="72">
        <div class="error" th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}">現在のパスワードが正しくありません</div>
    </div>

    <div class="form-row">
        <label for="newPassword">新しいパスワード <span class="required">*</span></label>
        <input type="password" id="newPassword" th:field="*{newPassword}"
               autocomplete="new-password" maxlength="72">
        <div class="muted small">8文字以上。</div>
        <div class="error" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}">パスワードは8文字以上72文字以内で入力してください</div>
    </div>

    <div class="form-row">
        <label for="confirmPassword">新しいパスワード(確認) <span class="required">*</span></label>
        <input type="password" id="confirmPassword" th:field="*{confirmPassword}"
               autocomplete="new-password" maxlength="72">
        <div class="error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">新しいパスワードと確認用のパスワードが一致しません</div>
    </div>

    <button type="submit" class="button">変更する</button>
    <a class="button button-secondary" th:href="@{/}">戻る</a>
</form>
</body>
</html>
