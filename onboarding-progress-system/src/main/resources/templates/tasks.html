<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>タスク一覧</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 2rem;
            color: #222;
        }
        table {
            border-collapse: collapse;
            width: 100%;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 0.5rem 0.75rem;
            text-align: left;
        }
        th {
            background: #f2f2f2;
        }
    </style>
</head>
<body>
<h1>タスク一覧</h1>

<p th:if="${#lists.isEmpty(tasks)}">タスクはまだありません。</p>

<table th:unless="${#lists.isEmpty(tasks)}">
    <thead>
    <tr>
        <th>ID</th>
        <th>タイトル</th>
        <th>説明</th>
        <th>Active</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="task : ${tasks}">
        <td th:text="${task.id}">1</td>
        <td th:text="${task.title}">タイトル</td>
        <td th:text="${task.description}">説明</td>
        <td th:text="${task.active} ? 'Yes' : 'No'">Yes</td>
    </tr>
    </tbody>
</table>
</body>
</html>
