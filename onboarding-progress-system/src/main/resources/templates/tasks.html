<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>タスク一覧</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav('tasks')}"></nav>

<h1>タスク一覧</h1>

<div th:replace="~{fragments/nav :: messages}"></div>

<div class="toolbar">
    <a class="button" th:href="@{/tasks/new}">新規登録</a>
</div>

<p th:if="${#lists.isEmpty(tasks)}">タスクはまだありません。</p>

<table th:unless="${#lists.isEmpty(tasks)}">
    <thead>
    <tr>
        <th>順番</th>
        <th>ID</th>
        <th>タイトル</th>
        <th>説明</th>
        <th>Active</th>
        <th>操作</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="task, stat : ${tasks}">
        <td class="order-cell">
            <form th:action="@{/tasks/{id}/move-up(id=${task.id})}" method="post">
                <button type="submit" class="button button-secondary button-small" title="上へ"
                        th:disabled="${stat.first}" th:attr="aria-label=${task.title} + ' を上へ'">↑</button>
            </form>
            <form th:action="@{/tasks/{id}/move-down(id=${task.id})}" method="post">
                <button type="submit" class="button button-secondary button-small" title="下へ"
                        th:disabled="${stat.last}" th:attr="aria-label=${task.title} + ' を下へ'">↓</button>
            </form>
        </td>
        <td th:text="${task.id}">1</td>
        <td th:text="${task.title}">タイトル</td>
        <td th:utext="${@links.linkify(task.description)}">説明</td>
        <td th:text="${task.active} ? 'Yes' : 'No'">Yes</td>
        <td class="actions">
            <a class="button button-secondary" th:href="@{/tasks/{id}/edit(id=${task.id})}">編集</a>
            <form th:action="@{/tasks/{id}/delete(id=${task.id})}" method="post"
                  onsubmit="return confirm('このタスクを削除しますか?\nユーザーへの割り当て(進捗)も削除されます。');">
                <button type="submit" class="button button-danger">削除</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
