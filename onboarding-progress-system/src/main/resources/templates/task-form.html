<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${taskId == null} ? 'タスク登録' : 'タスク編集'">タスク登録</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav('tasks')}"></nav>

<h1 th:text="${taskId == null} ? 'タスク登録' : 'タスク編集'">タスク登録</h1>

<form th:action="${taskId == null} ? @{/tasks} : @{/tasks/{id}(id=${taskId})}"
      th:object="${taskForm}" method="post">

    <div class="form-row">
        <label for="title">タイトル <span class="required">*</span></label>
        <input type="text" id="title" th:field="*{title}" maxlength="200">
        <div class="error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">タイトルを入力してください</div>
    </div>

    <div class="form-row">
        <label for="description">説明</label>
        <textarea id="description" th:field="*{description}" rows="4"></textarea>
    </div>

    <div class="form-row">
        <label class="checkbox">
            <input type="checkbox" th:field="*{active}"> 有効(Active)
        </label>
    </div>

    <button type="submit" class="button" th:text="${taskId == null} ? '登録する' : '更新する'">登録する</button>
    <a class="button button-secondary" th:href="@{/tasks}">一覧に戻る</a>
</form>
</body>
</html>
