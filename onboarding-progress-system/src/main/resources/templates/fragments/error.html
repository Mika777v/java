<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Body of the error pages (templates/error/*.html).
  Spring Boot passes ${status} (e.g. 404) and ${path} (the URL that was requested).
-->
<th:block th:fragment="page(heading, explanation)">
    <nav th:replace="~{fragments/nav :: nav('')}"></nav>

    <div class="error-page">
        <p class="error-code" th:text="'エラー ' + ${status}">エラー 404</p>
        <h1 th:text="${heading}">ページが見つかりません</h1>
        <p th:text="${explanation}">説明</p>
        <p class="muted small" th:if="${path}" th:text="'URL: ' + ${path}">URL: /tasks/999</p>

        <div class="toolbar">
            <a class="button" th:href="@{/tasks}">タスク一覧へ</a>
            <a class="button button-secondary" th:href="@{/users}">ユーザー一覧へ</a>
        </div>
    </div>
</th:block>
</body>
</html>
