<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<!--
  Body of the error pages (templates/error/*.html).
  Spring Boot passes ${status} (e.g. 404) and ${path} (the URL that was requested).
-->
<th:block th:fragment="page(heading, explanation)">
    <nav th:replace="~{fragments/nav :: nav('')}"></nav>

    <div class="error-page">
        <p class="error-code" th:text="'エラー ' + ${status}">エラー 404</p>
        <h1 th:text="${heading}">ページが見つかりません</h1>
        <p th:text="${explanation}">説明</p>
        <p class="muted small" th:if="${path}" th:text="'URL: ' + ${path}">URL: /tasks/999</p>

        <!-- Links that the viewer can actually open -->
        <div class="toolbar" sec:authorize="hasRole('ADMIN')">
            <a class="button" th:href="@{/}">ダッシュボードへ</a>
            <a class="button button-secondary" th:href="@{/tasks}">タスク一覧へ</a>
            <a class="button button-secondary" th:href="@{/users}">ユーザー一覧へ</a>
        </div>
        <div class="toolbar" sec:authorize="isAuthenticated() and !hasRole('ADMIN')">
            <a class="button" th:href="@{/me}">マイページへ</a>
        </div>
        <div class="toolbar" sec:authorize="!isAuthenticated()">
            <a class="button" th:href="@{/login}">ログイン画面へ</a>
        </div>
    </div>
</th:block>
</body>
</html>
