<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ユーザー一覧</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav('users')}"></nav>

<h1>ユーザー一覧</h1>

<div th:replace="~{fragments/nav :: messages}"></div>

<div class="toolbar">
    <a class="button" th:href="@{/users/new}">新規登録</a>
</div>

<form class="filter-form" th:action="@{/users}" method="get">
    <label>部署
        <select name="department">
            <option value="">すべて</option>
            <option th:each="d : ${departments}" th:value="${d}" th:text="${d}"
                    th:selected="${d == selectedDepartment}">開発部</option>
        </select>
    </label>
    <label>進捗
        <select name="status">
            <option value="">すべて</option>
            <option th:each="f : ${filters}" th:value="${f}" th:text="${f.label}"
                    th:selected="${f == selectedStatus}">未完了あり</option>
        </select>
    </label>
    <button type="submit" class="button button-secondary">絞り込む</button>
    <a th:if="${filtered}" th:href="@{/users}">条件をクリア</a>
</form>

<p class="muted" th:if="${filtered}"
   th:text="${totalUserCount} + ' 人中 ' + ${#lists.size(users)} + ' 人を表示しています。'">3 人中 1 人を表示しています。</p>

<p th:if="${totalUserCount == 0}">ユーザーはまだいません。</p>
<p th:if="${totalUserCount > 0 and #lists.isEmpty(users)}">条件に一致するユーザーはいません。</p>

<table th:unless="${#lists.isEmpty(users)}">
    <thead>
    <tr>
        <th>ID</th>
        <th>氏名</th>
        <th>部署</th>
        <th>入社日</th>
        <th>役割</th>
        <th>進捗</th>
        <th>操作</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="user : ${users}" th:with="p=${progress.getOrDefault(user.id, noProgress)}">
        <td th:text="${user.id}">1</td>
        <td><a th:href="@{/users/{id}(id=${user.id})}" th:text="${user.name}">山田 太郎</a></td>
        <td th:text="${user.department}">開発部</td>
        <td th:text="${user.joinedOn}">2026-04-01</td>
        <td>
            <span th:text="${user.role.label}">新入社員</span>
            <span class="muted small" th:unless="${@loginSettings.canLogIn(user)}">(ログイン不可)</span>
        </td>
        <td class="progress-cell">
            <span th:if="${user.admin}" class="muted">-</span>
            <span th:if="${!user.admin and p.total() == 0}" class="muted">未割り当て</span>
            <th:block th:if="${!user.admin and p.total() > 0}">
                <div class="progress" th:title="${p.percent() + '%'}">
                    <div class="progress-bar" th:style="'width:' + ${p.percent()} + '%'"></div>
                </div>
                <span th:text="${p.done() + ' / ' + p.total() + ' 完了(' + p.percent() + '%)'}">3 / 5 完了(60%)</span>
                <span class="badge-overdue" th:if="${p.hasOverdue()}"
                      th:text="'期限切れ ' + ${p.overdue()} + '件'">期限切れ 2件</span>
            </th:block>
        </td>
        <td class="actions">
            <a class="button button-secondary" th:href="@{/users/{id}(id=${user.id})}">詳細</a>
            <a class="button button-secondary" th:href="@{/users/{id}/edit(id=${user.id})}">編集</a>
            <form th:action="@{/users/{id}/delete(id=${user.id})}" method="post"
                  onsubmit="return confirm('このユーザーを削除しますか?\n割り当てられたタスクの進捗も削除されます。');">
                <button type="submit" class="button button-danger">削除</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
