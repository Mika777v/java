<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${user.name} + ' さんの進捗'">ユーザー詳細</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<nav th:replace="~{fragments/nav :: nav('users')}"></nav>

<h1 th:text="${user.name} + ' さんの進捗'">山田 太郎 さんの進捗</h1>

<div th:replace="~{fragments/nav :: messages}"></div>

<dl class="profile">
    <dt>メールアドレス</dt>
    <dd th:text="${user.email}">yamada@example.com</dd>
    <dt>部署</dt>
    <dd th:text="${user.department} ?: '-'">開発部</dd>
    <dt>入社日</dt>
    <dd th:text="${user.joinedOn} ?: '-'">2026-04-01</dd>
    <dt>進捗</dt>
    <dd>
        <span th:if="${progress.total() == 0}" class="muted">未割り当て</span>
        <th:block th:unless="${progress.total() == 0}">
            <div class="progress">
                <div class="progress-bar" th:style="'width:' + ${progress.percent()} + '%'"></div>
            </div>
            <span th:text="${progress.done() + ' / ' + progress.total() + ' 完了(' + progress.percent() + '%)'}">2 / 4 完了(50%)</span>
            <span class="badge-overdue" th:if="${progress.hasOverdue()}"
                  th:text="'期限切れ ' + ${progress.overdue()} + '件'">期限切れ 2件</span>
        </th:block>
    </dd>
</dl>

<div class="toolbar">
    <a class="button button-secondary" th:href="@{/users/{id}/edit(id=${user.id})}">ユーザー情報を編集</a>
    <a class="button button-secondary" th:href="@{/users}">一覧に戻る</a>
</div>

<h2>割り当てられたタスク</h2>

<p th:if="${#lists.isEmpty(assignments)}">まだタスクが割り当てられていません。下のフォームから割り当ててください。</p>

<table th:unless="${#lists.isEmpty(assignments)}">
    <thead>
    <tr>
        <th>タスク</th>
        <th>状態</th>
        <th>期限</th>
        <th>完了日時</th>
        <th>操作</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="a : ${assignments}">
        <td>
            <div th:text="${a.task.title}">PCのセットアップ</div>
            <div class="muted small" th:text="${a.task.description}">説明</div>
        </td>
        <td>
            <form class="inline-form"
                  th:action="@{/users/{id}/assignments/{aid}/status(id=${user.id},aid=${a.id})}" method="post">
                <select name="status" th:attr="aria-label=${a.task.title} + ' の状態'"
                        th:classappend="'status-' + ${a.status.name().toLowerCase()}">
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}"
                            th:selected="${s == a.status}">未着手</option>
                </select>
                <button type="submit" class="button button-secondary button-small">変更</button>
            </form>
        </td>
        <td>
            <span th:text="${a.dueDate} ?: '-'">2026-04-10</span>
            <span class="badge-overdue" th:if="${@dates.isOverdue(a)}">期限切れ</span>
        </td>
        <td th:text="${@dates.format(a.completedAt)}">2026-04-02 10:00</td>
        <td class="actions">
            <form th:action="@{/users/{id}/assignments/{aid}/delete(id=${user.id},aid=${a.id})}" method="post"
                  onsubmit="return confirm('このタスクの割り当てを解除しますか?\n進捗も削除されます。');">
                <button type="submit" class="button button-danger button-small">割り当て解除</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<h2>タスクを割り当てる</h2>

<p th:if="${#lists.isEmpty(assignableTasks)}" class="muted">
    割り当てられる有効なタスクはありません(有効なタスクはすべて割り当て済みです)。
</p>

<th:block th:unless="${#lists.isEmpty(assignableTasks)}">
    <form class="assign-form" th:action="@{/users/{id}/assignments(id=${user.id})}" method="post">
        <label>タスク
            <select name="taskId">
                <option value="">選択してください</option>
                <option th:each="t : ${assignableTasks}" th:value="${t.id}" th:text="${t.title}">就業規則の確認</option>
            </select>
        </label>
        <label>期限
            <input type="date" name="dueDate">
        </label>
        <button type="submit" class="button">割り当てる</button>
    </form>

    <form class="assign-form" th:action="@{/users/{id}/assignments/all(id=${user.id})}" method="post">
        <label>期限
            <input type="date" name="dueDate">
        </label>
        <button type="submit" class="button button-secondary"
                th:text="'有効なタスクをすべて割り当てる(' + ${#lists.size(assignableTasks)} + '件)'">有効なタスクをすべて割り当てる</button>
    </form>
</th:block>
</body>
</html>
