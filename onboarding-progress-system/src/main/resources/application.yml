spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/onboarding_db}
    username: ${SPRING_DATASOURCE_USERNAME:user}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
    # SQL is not printed by default (too much log output). To see it while learning or debugging,
    # start with SPRING_JPA_SHOW_SQL=true.
    show-sql: ${SPRING_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    # false: when pointed by mistake at a database that has other tables but no Flyway history,
    # stop with an error instead of marking V1 as done and changing that database.
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}

server:
  port: 8080
  tomcat:
    # Redirects say only the path (e.g. "/users/3"), and the browser keeps the address it is using.
    # Behind a proxy such as GitHub Codespaces, the app itself is reached as localhost:8080,
    # so a full address would send the browser to localhost and fail.
    use-relative-redirects: true

# Health check: only /actuator/health is published, and it only says UP or DOWN
# (it also checks the database connection). Other actuator endpoints are not published.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never

app:
  # Time zone used for "today" (overdue check) and for showing completion times
  time-zone: ${APP_TIME_ZONE:Asia/Tokyo}
  # First administrator, created on startup when no administrator exists yet.
  # The password must be given from outside (never written in the code).
  admin:
    email: ${APP_ADMIN_EMAIL:admin@example.com}
    password: ${APP_ADMIN_PASSWORD:}
    name: ${APP_ADMIN_NAME:管理者}
    # true: on startup, set the password of the administrator above back to APP_ADMIN_PASSWORD
    # (for when the only administrator forgot it). Remove after use.
    password-reset: ${APP_ADMIN_PASSWORD_RESET:false}
  # How new employees log in: "link" (personal link issued by an administrator, no password)
  # or "password" (email address and password). Administrators always use a password.
  member-login: ${APP_MEMBER_LOGIN:link}
  access-link:
    # How long a personal link can be used after it is issued
    valid-days: ${APP_ACCESS_LINK_VALID_DAYS:60}
  # Address of the app as seen from the browser, used to show personal links
  # (e.g. https://example.com). When empty, the address of the current request is used.
  base-url: ${APP_BASE_URL:}

# Feature toggles for the move to ticket management (docs/FEATURE_TOGGLE_STRATEGY.md).
# Switch with environment variables (FEATURE_TICKET_SYSTEM=true etc.) and restart.
# A feature under ticket-system stays off while ticket-system is off.
features:
  ticket-system:
    enabled: ${FEATURE_TICKET_SYSTEM:false}
  project-management:
    enabled: ${FEATURE_PROJECT_MANAGEMENT:false}
  comments:
    enabled: ${FEATURE_COMMENTS:false}
  notifications:
    enabled: ${FEATURE_NOTIFICATIONS:false}
  extended-roles:
    enabled: ${FEATURE_EXTENDED_ROLES:false}
  ticket-dashboard:
    enabled: ${FEATURE_TICKET_DASHBOARD:false}
  kanban-board:
    enabled: ${FEATURE_KANBAN_BOARD:false}
  # The current onboarding screens (turned off only when they are retired)
  onboarding-legacy:
    enabled: ${FEATURE_ONBOARDING_LEGACY:true}
