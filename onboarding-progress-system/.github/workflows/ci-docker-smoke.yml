name: CI Docker smoke test

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  docker-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and start services
        working-directory: onboarding-progress-system
        run: |
          docker compose up -d --build
          docker compose ps

      - name: Wait for database to be ready
        working-directory: onboarding-progress-system
        run: |
          for i in {1..30}; do
            if docker compose exec -T db pg_isready -U user -d onboarding_db; then
              echo "Database is ready"
              exit 0
            fi
            echo "Waiting for database... ($i/30)"
            sleep 5
          done
          echo "Database did not become ready in time"
          docker compose logs
          exit 1

      - name: Smoke test API
        working-directory: onboarding-progress-system
        run: |
          echo "GET /api/tasks"
          curl -sS -w "\nHTTP status: %{http_code}\n" http://localhost:8080/api/tasks

          echo "POST /api/tasks"
          POST_RESPONSE=$(curl -sS -w "\nHTTP status: %{http_code}\n" -X POST -H "Content-Type: application/json" -d '{"title":"Set up laptop","description":"Install tools","active":true}' http://localhost:8080/api/tasks)
          echo "$POST_RESPONSE"
          CREATED_ID=$(echo "$POST_RESPONSE" | grep -o '"id":[0-9]*' | head -n 1 | cut -d: -f2)

          if [ -z "$CREATED_ID" ]; then
            echo "No ID returned from POST request"
            docker compose logs
            exit 1
          fi

          echo "GET created task"
          curl -sS -w "\nHTTP status: %{http_code}\n" http://localhost:8080/api/tasks/$CREATED_ID

          echo "DELETE created task"
          curl -sS -w "\nHTTP status: %{http_code}\n" -X DELETE http://localhost:8080/api/tasks/$CREATED_ID

      - name: Show logs on failure
        if: failure()
        working-directory: onboarding-progress-system
        run: |
          echo "--- Docker compose logs ---"
          docker compose logs

      - name: Cleanup containers
        if: always()
        working-directory: onboarding-progress-system
        run: |
          docker compose down -v
