name: Reusable Docker Compose smoke test

on:
  workflow_call:
    inputs:
      project_dir:
        required: true
        type: string
      compose_file:
        required: false
        type: string
        default: docker-compose.yml
      # false: skip the check (e.g. a docs-only pull request). A skipped job counts as passed.
      run:
        required: false
        type: boolean
        default: true

# Only reads the repository (see the caller workflow)
permissions:
  contents: read

jobs:
  run-smoke:
    if: ${{ inputs.run }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate temporary passwords
        run: |
          # Random passwords for this run only; masked so they never appear in logs
          DB_PASSWORD="$(openssl rand -hex 16)"
          ADMIN_PASSWORD="$(openssl rand -hex 16)"
          echo "::add-mask::$DB_PASSWORD"
          echo "::add-mask::$ADMIN_PASSWORD"
          echo "POSTGRES_PASSWORD=$DB_PASSWORD" >> "$GITHUB_ENV"
          echo "APP_ADMIN_EMAIL=admin@example.com" >> "$GITHUB_ENV"
          echo "APP_ADMIN_PASSWORD=$ADMIN_PASSWORD" >> "$GITHUB_ENV"

      - name: Build and start services
        run: |
          set -e
          cd "${{ inputs.project_dir }}"
          docker compose up -d --build
          docker compose ps

      - name: Wait for database to be ready (if present)
        run: |
          set -e
          cd "${{ inputs.project_dir }}"
          if docker compose ps --services | grep -q '^db$'; then
            for i in {1..30}; do
              if docker compose exec -T db pg_isready -U user -d onboarding_db; then
                echo "Database is ready"
                break
              fi
              echo "Waiting for database... ($i/30)"
              sleep 5
            done
          else
            echo "No 'db' service found in docker-compose, skipping DB wait"
          fi

      - name: Wait for app to be ready
        run: |
          cd "${{ inputs.project_dir }}"
          # The health check answers {"status":"UP"} when the app and its database connection work
          for i in {1..36}; do
            if curl -sf http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "App is ready"
              exit 0
            fi
            echo "Waiting for app... ($i/36)"
            sleep 5
          done
          echo "App did not become ready in time"
          exit 1

      - name: Write test helpers
        run: |
          # Shared shell functions for the following steps (login session in a cookie file, CSRF token)
          cat > "$RUNNER_TEMP/helpers.sh" <<'HELPERS'
          BASE=http://localhost:8080
          ADMIN_JAR="$RUNNER_TEMP/admin-cookies.txt"
          API_AUTH="$APP_ADMIN_EMAIL:$APP_ADMIN_PASSWORD"

          # Fails the step if the HTTP status code is not the expected one
          check_status() {
            if [ "$2" != "$1" ]; then
              echo "Expected HTTP $1 but got HTTP $2"
              exit 1
            fi
          }

          # CSRF token of a page (needed to send forms), using the given cookie file
          csrf() {
            curl -sS -b "$1" -c "$1" "$BASE$2" | grep -o 'name="_csrf" value="[^"]*"' | head -n 1 | sed 's/.*value="//; s/"$//'
          }

          # Logs in through the login page; prints "status redirect_url"
          login() {
            TOKEN=$(csrf "$1" /login)
            curl -sS -o /dev/null -b "$1" -c "$1" -w "%{http_code} %{redirect_url}" -X POST \
              --data-urlencode "username=$2" --data-urlencode "password=$3" --data-urlencode "_csrf=$TOKEN" \
              "$BASE/login"
          }

          # Sends a form as the logged-in administrator (CSRF token taken from the given page)
          admin_post() {
            PAGE="$1"; URL="$2"; shift 2
            curl -sS -o /dev/null -w "%{http_code}" -b "$ADMIN_JAR" -c "$ADMIN_JAR" -X POST \
              --data-urlencode "_csrf=$(csrf "$ADMIN_JAR" "$PAGE")" "$@" "$BASE$URL"
          }

          admin_get() {
            curl -sS -b "$ADMIN_JAR" -c "$ADMIN_JAR" "$@"
          }
          HELPERS
          sed -i 's/^          //' "$RUNNER_TEMP/helpers.sh"

      - name: Smoke test login
        run: |
          set -e
          . "$RUNNER_TEMP/helpers.sh"

          echo "GET / without login (redirects to the login page)"
          RESULT=$(curl -sS -o /dev/null -w "%{http_code} %{redirect_url}" $BASE/)
          echo "$RESULT"
          case "$RESULT" in 302\ */login) ;; *) echo "Expected a redirect to /login"; exit 1 ;; esac

          echo "GET /api/tasks without credentials"
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" $BASE/api/tasks)
          echo "HTTP status: $STATUS"
          check_status 401 "$STATUS"

          echo "Log in with a wrong password"
          RESULT=$(login "$RUNNER_TEMP/wrong.txt" "$APP_ADMIN_EMAIL" "wrong-password")
          echo "$RESULT"
          case "$RESULT" in 302\ */login?error) ;; *) echo "Expected a redirect to /login?error"; exit 1 ;; esac

          echo "Log in as administrator"
          RESULT=$(login "$ADMIN_JAR" "$APP_ADMIN_EMAIL" "$APP_ADMIN_PASSWORD")
          echo "$RESULT"
          case "$RESULT" in 302\ */) ;; *) echo "Administrator login failed"; exit 1 ;; esac

      - name: Smoke test API (HTTP checks)
        run: |
          set -e
          . "$RUNNER_TEMP/helpers.sh"

          echo "GET /api/tasks"
          STATUS=$(curl -sS -u "$API_AUTH" -o /dev/stderr -w "%{http_code}" $BASE/api/tasks)
          echo; echo "HTTP status: $STATUS"
          check_status 200 "$STATUS"

          echo "POST /api/tasks"
          POST_BODY=$(curl -sS -u "$API_AUTH" -w "\n%{http_code}" -X POST -H "Content-Type: application/json" -d '{"title":"Set up laptop","description":"Install tools","active":true}' $BASE/api/tasks)
          STATUS=$(echo "$POST_BODY" | tail -n 1)
          echo "$POST_BODY" | sed '$d'
          echo "HTTP status: $STATUS"
          check_status 201 "$STATUS"
          CREATED_ID=$(echo "$POST_BODY" | grep -o '"id":[0-9]*' | head -n 1 | cut -d: -f2 || true)
          [ -n "$CREATED_ID" ] || { echo "No ID returned from POST request"; exit 1; }

          echo "GET created task"
          STATUS=$(curl -sS -u "$API_AUTH" -o /dev/stderr -w "%{http_code}" $BASE/api/tasks/$CREATED_ID)
          echo; echo "HTTP status: $STATUS"
          check_status 200 "$STATUS"

          echo "POST /api/tasks with \"active\": null (treated as active)"
          NULL_BODY=$(curl -sS -u "$API_AUTH" -w "\n%{http_code}" -X POST -H "Content-Type: application/json" -d '{"title":"CI null active","active":null}' $BASE/api/tasks)
          STATUS=$(echo "$NULL_BODY" | tail -n 1)
          echo "HTTP status: $STATUS"
          check_status 201 "$STATUS"
          NULL_ID=$(echo "$NULL_BODY" | grep -o '"id":[0-9]*' | head -n 1 | cut -d: -f2)
          echo "$NULL_BODY" | grep -q '"active":true' || { echo "active was not defaulted to true"; exit 1; }
          curl -sS -u "$API_AUTH" -o /dev/null -X DELETE $BASE/api/tasks/$NULL_ID

          echo "DELETE created task"
          STATUS=$(curl -sS -u "$API_AUTH" -o /dev/null -w "%{http_code}" -X DELETE $BASE/api/tasks/$CREATED_ID)
          echo "HTTP status: $STATUS"
          check_status 204 "$STATUS"

          echo "GET /tasks (HTML page)"
          STATUS=$(admin_get -o "$RUNNER_TEMP/tasks.html" -w "%{http_code}" $BASE/tasks)
          echo "HTTP status: $STATUS"
          check_status 200 "$STATUS"
          ROWS=$(grep -c '<tr>' "$RUNNER_TEMP/tasks.html" || true)
          echo "Table rows (including header): $ROWS"
          if [ "$ROWS" -lt 6 ]; then
            echo "Expected the header row and 5 sample tasks"
            exit 1
          fi

          echo "GET / (dashboard)"
          STATUS=$(admin_get -o "$RUNNER_TEMP/dashboard.html" -w "%{http_code}" $BASE/)
          echo "HTTP status: $STATUS"
          check_status 200 "$STATUS"
          grep -q "ダッシュボード" "$RUNNER_TEMP/dashboard.html" || { echo "Dashboard not shown"; exit 1; }
          grep -q "全体の完了率" "$RUNNER_TEMP/dashboard.html" || { echo "Overall progress not shown"; exit 1; }

      - name: Smoke test screens (create / edit / delete via forms)
        run: |
          set -e
          . "$RUNNER_TEMP/helpers.sh"

          echo "GET /tasks/new (registration form)"
          STATUS=$(admin_get -o /dev/null -w "%{http_code}" $BASE/tasks/new)
          echo "HTTP status: $STATUS"
          check_status 200 "$STATUS"

          echo "POST /tasks with empty title (validation error)"
          TOKEN=$(csrf "$ADMIN_JAR" /tasks/new)
          STATUS=$(admin_get -o "$RUNNER_TEMP/invalid.html" -w "%{http_code}" -X POST \
            --data-urlencode "_csrf=$TOKEN" --data-urlencode "title=" -d "_active=on" $BASE/tasks)
          echo "HTTP status: $STATUS"
          check_status 200 "$STATUS"
          grep -q "タイトルを入力してください" "$RUNNER_TEMP/invalid.html" || { echo "Validation message not shown"; exit 1; }

          echo "POST /tasks (create via form)"
          STATUS=$(admin_post /tasks/new /tasks \
            --data-urlencode "title=CI form task" --data-urlencode "description=created by CI" \
            -d "active=true" -d "_active=on")
          echo "HTTP status: $STATUS"
          check_status 302 "$STATUS"
          FORM_ID=$(curl -sS -u "$API_AUTH" $BASE/api/tasks | jq -r '.[] | select(.title=="CI form task") | .id')
          echo "Created task id: $FORM_ID"
          [ -n "$FORM_ID" ] || { echo "Task created via form was not found"; exit 1; }

          echo "GET /tasks/$FORM_ID/edit (edit form)"
          STATUS=$(admin_get -o /dev/null -w "%{http_code}" $BASE/tasks/$FORM_ID/edit)
          echo "HTTP status: $STATUS"
          check_status 200 "$STATUS"

          echo "POST /tasks/$FORM_ID (update via form, unchecking Active)"
          STATUS=$(admin_post /tasks/$FORM_ID/edit /tasks/$FORM_ID \
            --data-urlencode "title=CI form task (edited)" -d "_active=on")
          echo "HTTP status: $STATUS"
          check_status 302 "$STATUS"
          UPDATED=$(curl -sS -u "$API_AUTH" $BASE/api/tasks/$FORM_ID | jq -r '"\(.title)|\(.active)"')
          echo "Updated task: $UPDATED"
          [ "$UPDATED" = "CI form task (edited)|false" ] || { echo "Task was not updated as expected"; exit 1; }

          echo "POST /tasks/$FORM_ID/checklist (add a sub-item)"
          STATUS=$(admin_post /tasks/$FORM_ID/edit /tasks/$FORM_ID/checklist --data-urlencode "label=CI sub-item")
          echo "HTTP status: $STATUS"
          check_status 302 "$STATUS"
          admin_get $BASE/tasks/$FORM_ID/edit | grep -q "CI sub-item" || { echo "Sub-item not shown on the edit page"; exit 1; }

          echo "POST /tasks/$FORM_ID/delete (delete via form)"
          STATUS=$(admin_post /tasks /tasks/$FORM_ID/delete)
          echo "HTTP status: $STATUS"
          check_status 302 "$STATUS"
          STATUS=$(curl -sS -u "$API_AUTH" -o /dev/null -w "%{http_code}" $BASE/api/tasks/$FORM_ID)
          echo "GET /api/tasks/$FORM_ID after delete: HTTP $STATUS"
          check_status 404 "$STATUS"

      - name: Smoke test user screens (progress and assignments)
        run: |
          set -e
          . "$RUNNER_TEMP/helpers.sh"

          echo "GET /users (user list with progress)"
          STATUS=$(admin_get -o "$RUNNER_TEMP/users.html" -w "%{http_code}" $BASE/users)
          echo "HTTP status: $STATUS"
          check_status 200 "$STATUS"
          grep -q "4 / 4 完了(100%)" "$RUNNER_TEMP/users.html" || { echo "Progress of sample user not shown"; exit 1; }

          echo "GET /users/3 (user detail)"
          STATUS=$(admin_get -o /dev/null -w "%{http_code}" $BASE/users/3)
          echo "HTTP status: $STATUS"
          check_status 200 "$STATUS"

          echo "POST /users/3/assignments (assign task 3)"
          STATUS=$(admin_post /users/3 /users/3/assignments -d "taskId=3" -d "dueDate=2026-12-01")
          echo "HTTP status: $STATUS"
          check_status 302 "$STATUS"

          echo "GET /users (progress updated to 0 / 3)"
          admin_get $BASE/users | grep -q "0 / 3 完了(0%)" || { echo "Assignment not reflected in progress"; exit 1; }

          echo "GET /users?status=OVERDUE (filter users with overdue tasks)"
          STATUS=$(admin_get -o "$RUNNER_TEMP/overdue.html" -w "%{http_code}" "$BASE/users?status=OVERDUE")
          echo "HTTP status: $STATUS"
          check_status 200 "$STATUS"
          grep -q "佐藤 花子" "$RUNNER_TEMP/overdue.html" || { echo "Overdue user not listed"; exit 1; }
          if grep -q "山田 太郎" "$RUNNER_TEMP/overdue.html"; then echo "User without overdue tasks was listed"; exit 1; fi

          echo "GET /no-such-page (Japanese error page)"
          STATUS=$(admin_get -o "$RUNNER_TEMP/404.html" -w "%{http_code}" -H "Accept: text/html" $BASE/no-such-page)
          echo "HTTP status: $STATUS"
          check_status 404 "$STATUS"
          grep -q "ページが見つかりません" "$RUNNER_TEMP/404.html" || { echo "Japanese 404 page not shown"; exit 1; }

      - name: Smoke test new employee personal link
        run: |
          set -e
          . "$RUNNER_TEMP/helpers.sh"
          MEMBER_JAR="$RUNNER_TEMP/member-cookies.txt"

          echo "Issue a personal link for 鈴木 (user 3)"
          STATUS=$(admin_post /users/3 /users/3/access-link)
          echo "HTTP status: $STATUS"
          check_status 302 "$STATUS"

          echo "The link is shown once on the user page"
          LINK=$(admin_get -sS $BASE/users/3 | grep -o 'http[^"]*/join/[A-Za-z0-9_-]\{43\}' | head -n 1)
          [ -n "$LINK" ] || { echo "Personal link not shown"; exit 1; }
          echo "::add-mask::${LINK##*/}"
          echo "Link: $LINK"
          if admin_get -sS $BASE/users/3 | grep -q "${LINK##*/}"; then echo "The link is shown again"; exit 1; fi

          echo "Open the link as 鈴木 (logs in and redirects to /me)"
          RESULT=$(curl -sS -o /dev/null -b "$MEMBER_JAR" -c "$MEMBER_JAR" -w "%{http_code} %{redirect_url}" "$LINK")
          echo "$RESULT"
          case "$RESULT" in 302\ */me) ;; *) echo "Opening the personal link failed"; exit 1 ;; esac

          echo "GET / as new employee (redirects to /me)"
          RESULT=$(curl -sS -o /dev/null -b "$MEMBER_JAR" -w "%{http_code} %{redirect_url}" $BASE/)
          echo "$RESULT"
          case "$RESULT" in 302\ */me) ;; *) echo "Expected a redirect to /me"; exit 1 ;; esac

          echo "GET /me"
          STATUS=$(curl -sS -b "$MEMBER_JAR" -o "$RUNNER_TEMP/me.html" -w "%{http_code}" $BASE/me)
          echo "HTTP status: $STATUS"
          check_status 200 "$STATUS"
          grep -q "鈴木 一郎 さんのタスク" "$RUNNER_TEMP/me.html" || { echo "My page not shown"; exit 1; }

          echo "GET /tasks as new employee (forbidden)"
          STATUS=$(curl -sS -b "$MEMBER_JAR" -o "$RUNNER_TEMP/403.html" -w "%{http_code}" -H "Accept: text/html" $BASE/tasks)
          echo "HTTP status: $STATUS"
          check_status 403 "$STATUS"
          grep -q "このページを表示する権限がありません" "$RUNNER_TEMP/403.html" || { echo "Japanese 403 page not shown"; exit 1; }

          echo "An unknown link is rejected"
          STATUS=$(curl -sS -o "$RUNNER_TEMP/join.html" -w "%{http_code}" "$BASE/join/$(openssl rand -hex 22)")
          echo "HTTP status: $STATUS"
          check_status 404 "$STATUS"
          grep -q "このリンクは使えません" "$RUNNER_TEMP/join.html" || { echo "Invalid link page not shown"; exit 1; }

          echo "New employees cannot log in with a password"
          MEMBER_PASSWORD="$(openssl rand -hex 8)"
          echo "::add-mask::$MEMBER_PASSWORD"
          STATUS=$(admin_post /users/3/edit /users/3 \
            --data-urlencode "name=鈴木 一郎" -d "email=suzuki@example.com" --data-urlencode "department=開発部" \
            -d "joinedOn=2026-10-01" -d "role=MEMBER" --data-urlencode "password=$MEMBER_PASSWORD")
          check_status 302 "$STATUS"
          RESULT=$(login "$RUNNER_TEMP/member-password.txt" "suzuki@example.com" "$MEMBER_PASSWORD")
          echo "$RESULT"
          case "$RESULT" in *login\?error) ;; *) echo "Password login of new employee should fail"; exit 1 ;; esac

          echo "Revoke the link (it stops working)"
          STATUS=$(admin_post /users/3 /users/3/access-link/delete)
          check_status 302 "$STATUS"
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" "$LINK")
          echo "HTTP status: $STATUS"
          check_status 404 "$STATUS"

      - name: Smoke test administrator password change
        run: |
          set -e
          . "$RUNNER_TEMP/helpers.sh"
          NEW_ADMIN_PASSWORD="$(openssl rand -hex 8)"
          echo "::add-mask::$NEW_ADMIN_PASSWORD"

          echo "Change own password as administrator"
          STATUS=$(admin_post /me/password /me/password \
            --data-urlencode "currentPassword=$APP_ADMIN_PASSWORD" \
            --data-urlencode "newPassword=$NEW_ADMIN_PASSWORD" \
            --data-urlencode "confirmPassword=$NEW_ADMIN_PASSWORD")
          echo "HTTP status: $STATUS"
          check_status 302 "$STATUS"

          echo "Log in with the new password (and not with the old one)"
          RESULT=$(login "$RUNNER_TEMP/admin-new.txt" "$APP_ADMIN_EMAIL" "$NEW_ADMIN_PASSWORD")
          echo "$RESULT"
          case "$RESULT" in 302\ */) ;; *) echo "Login with the new password failed"; exit 1 ;; esac
          RESULT=$(login "$RUNNER_TEMP/admin-old.txt" "$APP_ADMIN_EMAIL" "$APP_ADMIN_PASSWORD")
          echo "$RESULT"
          case "$RESULT" in *login\?error) ;; *) echo "The old password still works"; exit 1 ;; esac

      - name: Smoke test first login password change
        run: |
          set -e
          . "$RUNNER_TEMP/helpers.sh"
          SECOND_JAR="$RUNNER_TEMP/second-admin-cookies.txt"
          INITIAL_PASSWORD="$(openssl rand -hex 8)"
          OWN_PASSWORD="$(openssl rand -hex 8)"
          echo "::add-mask::$INITIAL_PASSWORD"
          echo "::add-mask::$OWN_PASSWORD"

          echo "Register a second administrator with an initial password"
          STATUS=$(admin_post /users/new /users \
            --data-urlencode "name=管理者 二郎" -d "email=admin2@example.com" -d "role=ADMIN" \
            --data-urlencode "password=$INITIAL_PASSWORD")
          echo "HTTP status: $STATUS"
          check_status 302 "$STATUS"

          echo "Log in as the second administrator"
          RESULT=$(login "$SECOND_JAR" "admin2@example.com" "$INITIAL_PASSWORD")
          echo "$RESULT"
          case "$RESULT" in 302\ */) ;; *) echo "Login failed"; exit 1 ;; esac

          echo "Pages lead to the password change until it is done"
          RESULT=$(curl -sS -o /dev/null -b "$SECOND_JAR" -w "%{http_code} %{redirect_url}" $BASE/tasks)
          echo "$RESULT"
          case "$RESULT" in 302\ */me/password) ;; *) echo "Expected a redirect to /me/password"; exit 1 ;; esac
          curl -sS -b "$SECOND_JAR" $BASE/me/password | grep -q "管理者が設定したパスワードでログインしています" \
            || { echo "Notice not shown"; exit 1; }

          echo "Change the password"
          TOKEN=$(csrf "$SECOND_JAR" /me/password)
          RESULT=$(curl -sS -o /dev/null -b "$SECOND_JAR" -c "$SECOND_JAR" -w "%{http_code} %{redirect_url}" -X POST \
            --data-urlencode "currentPassword=$INITIAL_PASSWORD" \
            --data-urlencode "newPassword=$OWN_PASSWORD" \
            --data-urlencode "confirmPassword=$OWN_PASSWORD" \
            --data-urlencode "_csrf=$TOKEN" "$BASE/me/password")
          echo "$RESULT"
          case "$RESULT" in 302\ */) ;; *) echo "Password change failed"; exit 1 ;; esac

          echo "Pages open normally afterwards"
          STATUS=$(curl -sS -o /dev/null -b "$SECOND_JAR" -w "%{http_code}" $BASE/tasks)
          echo "HTTP status: $STATUS"
          check_status 200 "$STATUS"

      - name: Smoke test password reset
        run: |
          set -e
          . "$RUNNER_TEMP/helpers.sh"
          RESET_JAR="$RUNNER_TEMP/reset-cookies.txt"

          echo "Find the second administrator (registered in the previous step)"
          SECOND_ID=$(admin_get -sS $BASE/users | grep -o 'href="/users/[0-9]*">管理者 二郎' | grep -o '[0-9]\+' | head -n 1)
          [ -n "$SECOND_ID" ] || { echo "Second administrator not found"; exit 1; }
          echo "User id: $SECOND_ID"

          echo "Reset the password (a temporary password is shown once)"
          STATUS=$(admin_post /users/$SECOND_ID /users/$SECOND_ID/password-reset)
          echo "HTTP status: $STATUS"
          check_status 302 "$STATUS"
          TEMPORARY=$(admin_get -sS $BASE/users/$SECOND_ID | grep -o 'id="temporary-password"[^>]*value="[^"]*"' | sed 's/.*value="//; s/"$//')
          [ -n "$TEMPORARY" ] || { echo "Temporary password not shown"; exit 1; }
          echo "::add-mask::$TEMPORARY"
          if admin_get -sS $BASE/users/$SECOND_ID | grep -q "$TEMPORARY"; then echo "Temporary password shown again"; exit 1; fi

          echo "Log in with the temporary password (must change it first)"
          RESULT=$(login "$RESET_JAR" "admin2@example.com" "$TEMPORARY")
          echo "$RESULT"
          case "$RESULT" in 302\ */) ;; *) echo "Login with the temporary password failed"; exit 1 ;; esac
          RESULT=$(curl -sS -o /dev/null -b "$RESET_JAR" -w "%{http_code} %{redirect_url}" $BASE/)
          echo "$RESULT"
          case "$RESULT" in 302\ */me/password) ;; *) echo "Expected a redirect to /me/password"; exit 1 ;; esac

      - name: Show logs on failure
        if: failure()
        run: |
          cd "${{ inputs.project_dir }}"
          echo "--- Docker compose logs ---"
          docker compose logs || true

      - name: Cleanup containers
        if: always()
        run: |
          cd "${{ inputs.project_dir }}"
          docker compose down -v || true
