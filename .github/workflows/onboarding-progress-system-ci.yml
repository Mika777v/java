name: Onboarding progress system CI (caller)

on:
  # Runs when a pull request is opened, and again on every push to its branch
  pull_request:
    paths:
      - 'onboarding-progress-system/**'
      - '.github/workflows/onboarding-progress-system-ci.yml'
      - '.github/workflows/reusable-docker-smoke.yml'
  # Runs after merging into main, to confirm main itself is healthy
  push:
    branches:
      - main
    paths:
      - 'onboarding-progress-system/**'
      - '.github/workflows/onboarding-progress-system-ci.yml'
      - '.github/workflows/reusable-docker-smoke.yml'
  # "Run workflow" button on the Actions page (any branch)
  workflow_dispatch:

# When new commits are pushed to the same pull request, cancel the older, still-running check
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onboarding-progress-system
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: onboarding-progress-system/pom.xml

      # Integration tests start PostgreSQL with Testcontainers (Docker is available on the runner)
      - name: Run tests
        run: mvn -B test

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: onboarding-progress-system/target/surefire-reports

  call-reusable:
    uses: ./.github/workflows/reusable-docker-smoke.yml
    with:
      project_dir: onboarding-progress-system
